default_language_version:
  python: python3.13
exclude: ^data/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: requirements-txt-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: eslint
        name: JavaScript lint (ESLint)
        entry: npm run lint:js
        language: system
        files: ^(logscan_web/static/.*\.js|tests/.*\.cjs|eslint\.config\.cjs|package(-lock)?\.json)$
        pass_filenames: false
      - id: spellcheck
        name: Markdown spellcheck (CSpell)
        entry: npm run spellcheck
        language: system
        files: (\.md$|^cspell\.json$|^package(-lock)?\.json$)
        pass_filenames: false
